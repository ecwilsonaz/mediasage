services:
  mediasage:
    image: ghcr.io/ecwilsonaz/mediasage:latest
    # To build locally instead, comment out 'image' and uncomment 'build':
    # build: .
    container_name: mediasage
    # Optional: Run as specific user for NAS/Synology (use your PUID:PGID)
    # user: "1000:1000"
    ports:
      - "5765:5765"
    environment:
      # All optional: you can configure everything in the setup wizard instead.
      # Set values in .env (see .env.example), not here. A value set there overrides
      # Settings; anything left empty is ignored.

      # Media server: "plex" or "jellyfin" (auto-detected if only one URL is set)
      - MEDIA_SERVER=${MEDIA_SERVER:-}

      # Plex
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_MUSIC_LIBRARY=${PLEX_MUSIC_LIBRARY:-}
      - PLEX_PUBLIC_URL=${PLEX_PUBLIC_URL:-}
      - PLEX_TIMEOUT=${PLEX_TIMEOUT:-}
      - PLEX_SYNC_PAGE_SIZE=${PLEX_SYNC_PAGE_SIZE:-}

      # Jellyfin
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_TOKEN=${JELLYFIN_TOKEN:-}
      - JELLYFIN_MUSIC_LIBRARY=${JELLYFIN_MUSIC_LIBRARY:-}

      # AI provider, API keys and models
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL_ANALYSIS=${LLM_MODEL_ANALYSIS:-}
      - LLM_MODEL_GENERATION=${LLM_MODEL_GENERATION:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-}

      # Local AI providers (experimental)
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_CONTEXT_WINDOW=${OLLAMA_CONTEXT_WINDOW:-}
      - CUSTOM_LLM_URL=${CUSTOM_LLM_URL:-}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY:-}
      - CUSTOM_LLM_MODEL=${CUSTOM_LLM_MODEL:-}
      - CUSTOM_CONTEXT_WINDOW=${CUSTOM_CONTEXT_WINDOW:-}

      # Library sync
      - LIBRARY_SYNC_HOURS=${LIBRARY_SYNC_HOURS:-}
      - LIBRARY_INCREMENTAL_MINUTES=${LIBRARY_INCREMENTAL_MINUTES:-}
      - LIBRARY_CHECK_SECONDS=${LIBRARY_CHECK_SECONDS:-}
      - LIBRARY_RETRY_MINUTES=${LIBRARY_RETRY_MINUTES:-}

      # Performance tuning
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
    volumes:
      # Settings (config.user.yaml) and the library cache live here
      # Ensure directory is writable: either set 'user' above, or run:
      #   mkdir -p ./data && chmod 777 ./data
      - ./data:/app/data
    restart: unless-stopped
